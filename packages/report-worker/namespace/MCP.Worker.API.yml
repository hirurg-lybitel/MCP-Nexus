  -
    Properties:
      Class: "TgdcFunction"
      RUID: 900000050_900000001
      AlwaysOverwrite: True
      DontRemove: False
      IncludeSiblings: False
      HeadObject: 900000040_900000001
    Fields:
      OBJECTNAME: "APPLICATION"
