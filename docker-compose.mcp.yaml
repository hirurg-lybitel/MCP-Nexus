services:
  mcp-server:
    container_name: mcp-nexus-server
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-4005}:4005"
    env_file:
      - .env
    environment:
      TZ: Europe/Minsk
      NODE_ENV: production
      MCP_HOST: 0.0.0.0
      MCP_PORT: "4005"
      GEDEMIN_WORKER_URL: ${GEDEMIN_WORKER_URL:-http://host.docker.internal:9080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
